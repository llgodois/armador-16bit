<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estilos dos jogadores</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #labels { position: fixed; left: 0; right: 0; top: 18px; display: flex; justify-content: space-around; pointer-events: none; }
      #labels div { color: #e8eef7; font-weight: 800; font-size: 26px; letter-spacing: 0.04em; text-shadow: 0 2px 4px #000; }
      #hint { position: fixed; bottom: 14px; width: 100%; text-align: center; color: #a9b8cc; font-weight: 600; font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="hint">Armador baixo (1,88 m) e pivô alto (2,13 m) em cada estilo  ·  ESPAÇO: parar/girar</div>
    <script type="module" src="./src/v3d/stylelab.js"></script>
  </body>
</html>
